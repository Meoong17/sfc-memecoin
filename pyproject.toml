[project]
name = "sfc-memecoin"
version = "0.1.0"
description = "SFC Memecoin Screening Engine — on-chain meme coin screener with Insider Intelligence Engine"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-docx>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
